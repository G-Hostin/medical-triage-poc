[project]
name = "medical-triage-poc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "datasets>=5.1.0",
    "en-core-web-md",
    "faker>=40.44.0",
    "fr-core-news-md",
    "pandas>=3.1.0",
    "presidio-analyzer>=2.2.366",
    "presidio-anonymizer>=2.2.366",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "torch==2.15.0",
    "transformers>=5.22.1",
]

[tool.uv.sources]
fr-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl" }
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
torch = { index = "pytorch-cu132" }

# torch avec CUDA pour la carte graphique (pilote compatible CUDA 13.3)
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "matplotlib>=3.11.2",
]
